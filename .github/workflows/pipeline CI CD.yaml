name: test and deploy

on:
  push:
    branches: main

jobs:
  # unit test
  unit-test:
    runs-on: ubuntu-latest
    steps:

      - name: clone repo
        uses: actions/checkout@v4

      - run: ls -al

      - name: test
        run: |
          npm install
          npm run test

  # build docker image
  build-docker-image:
      runs-on: ubuntu-latest
      needs: unit-test
      steps:
       - name: clone repo
         uses: actions/checkout@v4
       
       - name: build image 
         run: docker build -t smartjob2026/back-session18 . 
       - name: check image
         run: docker images
  # deploy