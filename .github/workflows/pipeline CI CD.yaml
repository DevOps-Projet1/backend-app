name: test and deploy

on:
  push:
    branches: main

jobs:
  # unit test
  unit-test:
    runs-on: ubuntu-latest
    steps:

      - name: clone repo
        uses: actions/checkout@v4

      - run: ls -al

      - name: test
        run: |
          npm install
          npm run test

  # build docker image
  build-docker-image:
      runs-on: ubuntu-latest
      needs: unit-test
      steps:
       - name: clone repo
         uses: actions/checkout@v4
       
       - name: build image 
         run: docker build -t smartjob2026/back-session18:v§{{github.run_number}} . 
       - name: tag latest image
         run: docker tag smartjob2026/back-session18:v§{{github.run_number}}  smartjob2026/back-session18: latest

       - name: check image
         run: docker images
          
       - name: Login to Docker Hub
         uses: docker/login-action@v3
         with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
       - name: push image 
         run: docker push smartjob2026/back-session18:v§{{github.run_number}}
       - name: push image 
         run: docker push smartjob2026/back-session18:latest
  # deploy